<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .slide{position:absolute;left:60px;top:56px;width:480px;height:240px;background:#14181e;border-radius:12px;box-shadow:0 14px 30px rgba(15,43,91,.25);color:#e9ecf1;padding:22px 26px;overflow:hidden}
  .ep{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff6e5;opacity:.8}
  h2{margin:6px 0 14px;font-size:26px;line-height:1.05;letter-spacing:-.02em;color:#fff}
  pre{margin:0;background:#2f3640;border-radius:8px;padding:12px 14px;font:11px/1.6 ui-monospace,Consolas,monospace;color:#b3bac5}
  pre b{color:#fff6e5;font-weight:600}pre u{text-decoration:none;color:#8d97a5}
  .cap{position:absolute;left:60px;right:60px;top:316px;height:30px;display:flex;align-items:center;gap:10px}
  .play{width:26px;height:26px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
  .play::after{content:"";border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
  .track{flex:1;height:4px;border-radius:2px;background:var(--hair);position:relative}.track::after{content:"";position:absolute;left:0;top:0;bottom:0;width:34%;border-radius:2px;background:var(--link)}
  .t{font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="slide">
  <div class="ep">Episode 01</div>
  <h2>From first idea<br>to demo video</h2>
  <pre><u>$</u> <b>claude</b> "scaffold the API and the web app"
<u>✓</u> AGENTS.md written
<u>✓</u> 12 specs drafted
<u>✓</u> repo ready for the first slice</pre>
</div>
<div class="cap"><span class="play"></span><span class="track"></span><span class="t">3:12 / 9:20</span></div>
</body></html>
