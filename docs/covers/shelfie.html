<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .app{position:absolute;left:70px;top:22px;width:460px;height:332px;background:#f7f8fa;border:1px solid rgba(15,18,22,.12);border-radius:16px;overflow:hidden;color:#14181e;font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 20px;background:#fff;border-bottom:1px solid #e9ecf1;font-weight:800;font-size:15px;color:#6d28d9}
  .bar i{width:18px;height:18px;border-radius:5px;background:#7c3aed;display:block}
  .bar span{margin-left:auto;font-size:10px;font-weight:700;color:#5b6472}
  .body{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:18px 20px}
  .book{height:200px;border-radius:8px 12px 12px 8px;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;padding:16px 12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 14px rgba(109,40,217,.25)}
  .book b{font-size:16px;line-height:1.15}.book small{font-size:9px;opacity:.85}
  h4{margin:0 0 4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#6d28d9}
  .q{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:10px}
  .a{border:1.5px solid #d3d8e0;background:#fff;border-radius:10px;padding:8px 10px;font-size:10.5px;margin-bottom:6px}
  .a.on{border-color:#7c3aed;background:#f5f0ff;font-weight:700;color:#5b21b6}
  .prog{display:flex;gap:4px;margin:10px 0 12px}.prog s{flex:1;height:6px;border-radius:3px;background:#e9ecf1}.prog s.d{background:#7c3aed}
  .rew{display:flex;align-items:center;gap:8px;background:#fff6e5;border:1px solid #f3d9a0;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:700;color:#8a5a00}
  .rew i{width:20px;height:20px;border-radius:50%;background:#f4b23c;display:block}
</style></head><body>
<div class="app">
  <div class="bar"><i></i>Shelfie<span>Chapter 7 of 12</span></div>
  <div class="body">
    <div class="book"><b>The Wild Robot</b><small>Peter Brown</small></div>
    <div>
      <h4>Question 2 of 3</h4>
      <div class="q">Why did Roz decide to stay on the island?</div>
      <div class="a">She had nowhere else to go</div>
      <div class="a on">She had made friends there</div>
      <div class="a">The boat was broken</div>
      <div class="prog"><s class="d"></s><s class="d"></s><s></s><s></s><s></s></div>
      <div class="rew"><i></i>5 more chapters to your sticker</div>
    </div>
  </div>
</div>
</body></html>
